{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-3">Configuración de email</h4>
                <p class="text-muted">Usa Gmail, Outlook o cualquier servidor SMTP para enviar recordatorios.</p>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Servidor SMTP</label>
                        <input name="smtp_host" class="form-control" value="{{ settings.smtp_host }}">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Puerto</label>
                            <input name="smtp_port" type="number" class="form-control" value="{{ settings.smtp_port }}">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Usuario (correo)</label>
                            <input name="smtp_user" class="form-control" value="{{ settings.smtp_user }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input name="smtp_password" type="password" class="form-control" value="{{ settings.smtp_password }}">
                        <small class="text-muted">Para Gmail usa una <a href="https://support.google.com/accounts/answer/185833" target="_blank">contraseña de aplicación</a>.</small>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Correo from</label>
                            <input name="from_email" class="form-control" value="{{ settings.from_email }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nombre from</label>
                            <input name="from_name" class="form-control" value="{{ settings.from_name }}">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
