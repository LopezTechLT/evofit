{% extends "base.html" %}

{% block content %}
<div class="fitness-shell text-dark">
    <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
        <div>
            <div class="text-muted small" id="greeting">Fitness</div>
            <h2 class="mb-0" id="hello">Hola</h2>
        </div>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('admin.dashboard') if current_user.role != 'user' else url_for('main.client_dashboard') }}">Volver</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="card fitness-card p-4 h-100">
                <div class="d-flex align-items-start justify-content-between gap-3">
                    <div>
                        <div class="text-uppercase small text-muted" style="letter-spacing: .18em;">Rutina de hoy</div>
                        <div class="fs-4 fw-semibold mt-1" id="routineName">—</div>
                        <div class="text-muted" id="routineFocus">Selecciona una rutina</div>
                    </div>
                    <div class="text-end">
                        <div class="badge rounded-pill bg-light text-dark border border-dark-10 px-3 py-2" id="routineMeta">—</div>
                    </div>
                </div>

                <div class="mt-4">
                    <div class="d-flex justify-content-between small text-muted">
                        <span>Progreso al siguiente nivel</span>
                        <span><span id="xpToNext">—</span> XP</span>
                    </div>
                    <div class="fitness-progress mt-2">
                        <div class="fitness-progress-bar" id="xpBar" style="width: 0%"></div>
                    </div>
                </div>

                <div class="row g-2 mt-4">
                    <div class="col-6 col-md-3">
                        <div class="fitness-pill">
                            <div class="small text-muted">Nivel</div>
                            <div class="fw-semibold" id="level">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="fitness-pill fitness-pill-hot">
                            <div class="small">Racha</div>
                            <div class="fw-semibold" id="streak">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="fitness-pill">
                            <div class="small text-muted">Semana</div>
                            <div class="fw-semibold" id="weekMin">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="fitness-pill">
                            <div class="small text-muted">Calorías</div>
                            <div class="fw-semibold" id="weekKcal">—</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card fitness-card p-4 h-100">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <div class="text-uppercase small text-muted" style="letter-spacing: .18em;">Progreso semanal</div>
                    <span class="small text-muted">min (naranja) / kcal (rojo)</span>
                </div>
                <div style="position: relative; height: 220px;">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card fitness-card p-4">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="text-uppercase small text-muted" style="letter-spacing: .18em;">Rutinas</div>
                    <a class="btn btn-sm btn-dark" href="{{ url_for('main.clients') }}">Clientes</a>
                </div>
                <div class="row g-3 mt-2" id="routinesGrid">
                    <div class="col-12 text-muted">Cargando...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .fitness-shell {
        background: radial-gradient(900px 520px at 20% 0%, rgba(15, 23, 42, 0.04), transparent 60%),
                    radial-gradient(900px 520px at 80% 18%, rgba(15, 23, 42, 0.03), transparent 60%),
                    #ffffff;
        border-radius: 1.5rem;
        padding: 1.25rem;
        border: 1px solid rgba(17,24,39,0.08);
        box-shadow: 0 0 0 1px rgba(17,24,39,0.04), 0 30px 80px rgba(15,23,42,0.10);
    }
    .fitness-card {
        background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(248,250,252,0.95));
        border: 1px solid rgba(17,24,39,0.10);
        border-radius: 1.25rem;
        box-shadow: 0 0 0 1px rgba(17,24,39,0.03), 0 18px 55px rgba(15,23,42,0.08);
    }
    .border-dark-10 { border-color: rgba(17,24,39,0.12) !important; }
    .fitness-pill {
        border-radius: 1.25rem;
        border: 1px solid rgba(17,24,39,0.10);
        background: rgba(248,250,252,0.9);
        padding: .75rem .9rem;
    }
    .fitness-pill-hot {
        border-color: rgba(17,24,39,0.10);
        background: rgba(255,255,255,0.92);
        color: #111827;
    }
    .fitness-progress {
        height: 10px;
        border-radius: 999px;
        background: rgba(17,24,39,0.10);
        overflow: hidden;
    }
    .fitness-progress-bar {
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, #f97316, #ef4444);
        transition: width .6s ease;
    }
    .routine-tile {
        border-radius: 1.25rem;
        border: 1px solid rgba(17,24,39,0.10);
        background: rgba(255,255,255,0.96);
        overflow: hidden;
        transition: transform .18s ease, box-shadow .18s ease;
        color: inherit;
    }
    .routine-tile:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 50px rgba(15,23,42,0.16);
    }
    .routine-hero {
        height: 88px;
        background: radial-gradient(circle at 25% 25%, rgba(249,115,22,0.20), transparent 55%),
                    radial-gradient(circle at 80% 20%, rgba(239,68,68,0.16), transparent 50%),
                    #111827;
    }
    .overlay {
        position: fixed;
        inset: 0;
        z-index: 1050;
        background: rgba(15,23,42,0.55);
        backdrop-filter: blur(10px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }
    .overlay.show { display: flex; }
    .modal-shell {
        width: min(920px, 100%);
        max-height: 90vh;
        overflow: auto;
        border-radius: 1.25rem;
        border: 1px solid rgba(17,24,39,0.12);
        background: #ffffff;
        box-shadow: 0 30px 100px rgba(15,23,42,0.30);
    }
    .train-shell {
        width: min(980px, 100%);
        min-height: 70vh;
        border-radius: 1.25rem;
        border: 1px solid rgba(17,24,39,0.12);
        background: radial-gradient(900px 600px at 25% 0%, rgba(249, 115, 22, 0.12), transparent 55%),
                    radial-gradient(900px 600px at 80% 25%, rgba(239, 68, 68, 0.10), transparent 55%),
                    #ffffff;
        box-shadow: 0 30px 100px rgba(15,23,42,0.30);
    }
    .mono { font-variant-numeric: tabular-nums; }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const initialData = {{ initial_data | tojson | safe }};
    const routineOverlay = createOverlay('routineOverlay');
    const trainOverlay = createOverlay('trainOverlay');

    function createOverlay(id) {
        const el = document.createElement('div');
        el.id = id;
        el.className = 'overlay';
        el.addEventListener('click', (e) => { if (e.target === el) hideOverlay(el); });
        document.body.appendChild(el);
        return el;
    }

    function showOverlay(el) { el.classList.add('show'); }
    function hideOverlay(el) { el.classList.remove('show'); el.innerHTML = ''; }

    function escapeHtml(s) {
        return (s ?? '').toString()
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function formatMMSS(totalSeconds) {
        const s = Math.max(0, Math.floor(totalSeconds));
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        return `${mm}:${ss}`;
    }

    async function loadFitness() {
        let me, dash, routines, weekly;

        if (typeof initialData !== 'undefined' && initialData) {
            me = initialData.me;
            dash = initialData.dash;
            routines = initialData.routines;
            weekly = initialData.weekly;
        } else {
            const [meRes, dashRes, routinesRes, weeklyRes] = await Promise.all([
                fetch('/api/me', { credentials: 'include' }),
                fetch('/api/fitness/dashboard', { credentials: 'include' }),
                fetch('/api/client/routines', { credentials: 'include' }),
                fetch('/api/fitness/progress/weekly', { credentials: 'include' })
            ]);

            if (!meRes.ok || !dashRes.ok) {
                document.getElementById('hello').textContent = 'Inicia sesión para ver Fitness';
                return;
            }

            me = await meRes.json();
            dash = await dashRes.json();
            routines = routinesRes.ok ? await routinesRes.json() : { items: [] };
            weekly = weeklyRes.ok ? await weeklyRes.json() : { items: [] };
        }

        document.getElementById('greeting').textContent = dash.greeting || 'Fitness';
        document.getElementById('hello').textContent = `Hola, ${me.username}`;

        const r = dash.routineOfDay;
        document.getElementById('routineName').textContent = r ? r.name : '—';
        document.getElementById('routineFocus').textContent = r ? r.focus : 'Selecciona una rutina';
        document.getElementById('routineMeta').textContent = r ? `${r.durationMinutes} min • ${r.exercisesCount} ex • ${r.estimatedKcal} kcal` : '—';

        document.getElementById('xpToNext').textContent = dash.xpToNext ?? '—';
        document.getElementById('level').textContent = `Lv ${dash.level ?? 1}`;
        document.getElementById('streak').textContent = `${dash.streakDays ?? 0} días`;
        document.getElementById('weekMin').textContent = `${dash.weekly?.minutes ?? 0} min`;
        document.getElementById('weekKcal').textContent = `${dash.weekly?.kcal ?? 0} kcal`;

        const xp = dash.xp ?? 0;
        const progress = ((xp % 250) / 250) * 100;
        document.getElementById('xpBar').style.width = `${Math.max(0, Math.min(100, progress))}%`;

        // weekly chart
        const ctx = document.getElementById('weeklyChart');
        if (ctx && window.Chart) {
            const existing = Chart.getChart ? Chart.getChart(ctx) : null;
            if (existing) existing.destroy();

            const labels = (weekly.items || []).map(i => i.date);
            const minutes = (weekly.items || []).map(i => i.minutes);
            const kcals = (weekly.items || []).map(i => i.kcal);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Minutos', data: minutes, borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,0.15)', tension: 0.35 },
                        { label: 'Kcal', data: kcals, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.12)', tension: 0.35 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: 'rgba(17,24,39,0.55)' }, grid: { color: 'rgba(17,24,39,0.08)' } },
                        y: { ticks: { color: 'rgba(17,24,39,0.55)' }, grid: { color: 'rgba(17,24,39,0.08)' } }
                    }
                }
            });
        }

        // routines grid
        const grid = document.getElementById('routinesGrid');
        grid.innerHTML = '';
        (routines.items || []).slice(0, 12).forEach(item => {
            const col = document.createElement('div');
            col.className = 'col-12 col-md-6 col-lg-4';
            col.innerHTML = `
                <button class="routine-tile w-100 text-start" type="button" data-routine-id="${item.id}">
                    <div class="routine-hero"></div>
                    <div class="p-3">
                        <div class="fw-semibold">${escapeHtml(item.name)}</div>
                        <div class="text-muted small">${escapeHtml(item.focus)} • ${escapeHtml(item.difficulty)}</div>
                        <div class="d-flex gap-2 mt-2 small text-muted">
                            <span>${item.durationMinutes} min</span>
                            <span>•</span>
                            <span>${item.exercisesCount} ex</span>
                            <span>•</span>
                            <span>${item.estimatedKcal} kcal</span>
                        </div>
                    </div>
                </button>
            `;
            grid.appendChild(col);
        });

        if ((routines.items || []).length === 0) {
            grid.innerHTML = '<div class="col-12 text-muted">No hay rutinas todavía.</div>';
        }

        grid.querySelectorAll('[data-routine-id]').forEach((btn) => {
            btn.addEventListener('click', () => openRoutineDetail(Number(btn.dataset.routineId)));
        });
    }

    async function openRoutineDetail(routineId) {
        const res = await fetch(`/api/client/routines/${routineId}`, { credentials: 'include' });
        if (!res.ok) return;
        const data = await res.json();

        routineOverlay.innerHTML = `
            <div class="modal-shell p-4">
                <div class="d-flex align-items-start justify-content-between gap-3">
                    <div>
                        <div class="text-uppercase small text-muted" style="letter-spacing: .18em;">Rutina</div>
                        <div class="fs-4 fw-semibold mt-1">${escapeHtml(data.name)}</div>
                        <div class="text-muted">${escapeHtml(data.focus)} • ${escapeHtml(data.difficulty)} • ${data.durationMinutes} min</div>
                    </div>
                    <button class="btn btn-sm btn-outline-secondary" type="button" id="closeRoutine">Cerrar</button>
                </div>

                <div class="row g-3 mt-2">
                    <div class="col-lg-7">
                        <div class="card fitness-card p-3">
                            <div class="text-muted small mb-2">Ejercicios</div>
                            <div class="table-responsive">
                                <table class="table table-sm align-middle mb-0">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Ejercicio</th>
                                            <th>Series</th>
                                            <th>Reps</th>
                                            <th>Descanso</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${(data.exercises || []).map((ex, i) => `
                                            <tr>
                                                <td>${i + 1}</td>
                                                <td>
                                                    <div class="fw-semibold">${escapeHtml(ex.name)}</div>
                                                    ${ex.notes ? `<div class="text-muted small">${escapeHtml(ex.notes)}</div>` : ''}
                                                </td>
                                                <td>${ex.sets}</td>
                                                <td>${ex.reps}</td>
                                                <td>${ex.restSeconds}s</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="card fitness-card p-3 h-100">
                            <div class="text-muted small">Resumen</div>
                            <div class="mt-2 d-flex flex-wrap gap-2">
                                <span class="badge rounded-pill bg-light text-dark border border-dark-10 px-3 py-2">${data.exercisesCount} ejercicios</span>
                                <span class="badge rounded-pill bg-light text-dark border border-dark-10 px-3 py-2">${data.estimatedKcal} kcal</span>
                                <span class="badge rounded-pill bg-light text-dark border border-dark-10 px-3 py-2">${data.durationMinutes} min</span>
                            </div>
                            <div class="mt-3 text-muted small">Modo entrenar</div>
                            <button class="btn btn-dark mt-2" type="button" id="startTrain">Iniciar</button>
                            <div class="text-muted small mt-3">Tip</div>
                            <div class="small text-muted">Marca series completadas y usa el temporizador de descanso automático.</div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        routineOverlay.querySelector('#closeRoutine').addEventListener('click', () => hideOverlay(routineOverlay));
        routineOverlay.querySelector('#startTrain').addEventListener('click', () => {
            hideOverlay(routineOverlay);
            startTraining(data);
        });
        showOverlay(routineOverlay);
    }

    function startTraining(routine) {
        const exercises = routine.exercises || [];
        let idx = 0;
        let phase = 'exercise'; // exercise | rest
        let restLeft = exercises[0]?.restSeconds ?? 60;
        let total = 0;
        let sessionId = null;
        const seriesDone = new Array(exercises.length).fill(0);

        fetch('/api/fitness/workouts/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ routineId: null })
        }).then(r => r.ok ? r.json() : null).then(d => { sessionId = d?.sessionId ?? null; }).catch(() => {});

        const tick = setInterval(() => {
            total += 1;
            if (phase === 'rest') {
                restLeft = Math.max(0, restLeft - 1);
                if (restLeft === 0) {
                    if (idx + 1 < exercises.length) {
                        idx += 1;
                        phase = 'exercise';
                        restLeft = exercises[idx]?.restSeconds ?? 60;
                    } else {
                        finishWorkout();
                    }
                }
            }
            render();
        }, 1000);

        function finishWorkout() {
            clearInterval(tick);
            const kcal = routine.estimatedKcal ?? Math.floor(total / 60) * 6;
            if (sessionId) {
                fetch(`/api/fitness/workouts/${sessionId}/finish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ totalSeconds: total, kcalBurned: kcal })
                }).catch(() => {});
            }
            hideOverlay(trainOverlay);
            loadFitness();
        }

        function render() {
            const ex = exercises[idx] || {};
            const progress = exercises.length ? ((idx + (phase === 'rest' ? 0.5 : 0)) / exercises.length) : 0;
            trainOverlay.innerHTML = `
                <div class="train-shell p-4 text-dark">
                    <div class="d-flex align-items-start justify-content-between gap-3">
                        <div>
                            <div class="text-uppercase small text-muted" style="letter-spacing: .18em;">Entrenar ahora</div>
                            <div class="fs-4 fw-semibold mt-1">${escapeHtml(routine.name)}</div>
                            <div class="text-muted">${escapeHtml(routine.focus)} • ${routine.durationMinutes} min • ${routine.exercisesCount} ex</div>
                        </div>
                        <div class="text-end">
                            <div class="text-muted small">Total</div>
                            <div class="fs-4 fw-semibold mono">${formatMMSS(total)}</div>
                            <button class="btn btn-sm btn-outline-secondary mt-2" type="button" id="exitTrain">Salir</button>
                        </div>
                    </div>

                    <div class="fitness-progress mt-3">
                        <div class="fitness-progress-bar" style="width: ${Math.max(0, Math.min(100, progress * 100))}%"></div>
                    </div>
                    <div class="d-flex justify-content-between small text-muted mt-2">
                        <span>${exercises.length ? `${idx + 1}/${exercises.length}` : '—'}</span>
                        <span>${phase === 'exercise' ? 'Ejercicio' : 'Descanso'}</span>
                    </div>

                    <div class="row g-3 mt-2">
                        <div class="col-lg-7">
                            <div class="card fitness-card p-4">
                                <div class="text-muted small">${phase === 'exercise' ? 'Ejercicio actual' : 'Descanso'}</div>
                                <div class="display-6 fw-semibold mt-1">${phase === 'exercise' ? escapeHtml(ex.name) : 'Recupera'}</div>
                                <div class="text-muted mt-2">
                                    ${phase === 'exercise'
                                        ? `${ex.sets} series • ${ex.reps} reps • descanso ${ex.restSeconds}s`
                                        : `Siguiente: <span class="text-dark">${escapeHtml(exercises[idx + 1]?.name ?? '—')}</span>`}
                                </div>
                                ${ex.notes ? `<div class="mt-3 small text-muted">Notas: ${escapeHtml(ex.notes)}</div>` : ''}

                                <div class="mt-4 d-flex flex-wrap gap-2">
                                    <button class="btn btn-dark" type="button" id="prevEx" ${idx === 0 ? 'disabled' : ''}>Anterior</button>
                                    <button class="btn btn-dark" type="button" id="nextEx" ${idx + 1 >= exercises.length ? 'disabled' : ''}>Siguiente</button>
                                    <button class="btn btn-outline-secondary" type="button" id="markSet">Serie (${seriesDone[idx]})</button>
                                    ${phase === 'exercise'
                                        ? `<button class="btn btn-outline-secondary" type="button" id="startRest">Iniciar descanso</button>`
                                        : `<button class="btn btn-outline-secondary" type="button" id="skipRest">Saltar descanso</button>`}
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-5">
                            <div class="card fitness-card p-4 h-100">
                                <div class="text-muted small">Temporizador</div>
                                <div class="display-5 fw-semibold mono mt-2">${phase === 'rest' ? formatMMSS(restLeft) : '—'}</div>
                                <div class="small text-muted">${phase === 'rest' ? 'Descanso restante' : 'Pulsa “Iniciar descanso” al terminar el ejercicio'}</div>
                                <hr class="my-3" style="border-color: rgba(17,24,39,0.12);">
                                <div class="text-muted small">Lista rápida</div>
                                <div class="mt-2" style="max-height: 220px; overflow:auto;">
                                    ${(exercises || []).map((e, i) => `
                                        <div class="d-flex align-items-center justify-content-between py-2 ${i === idx ? 'text-dark' : 'text-muted'}" style="border-bottom: 1px solid rgba(17,24,39,0.08);">
                                            <div>
                                                <div class="fw-semibold small">${i + 1}. ${escapeHtml(e.name)}</div>
                                                <div class="small">${e.sets}x${e.reps} • ${e.restSeconds}s</div>
                                            </div>
                                            <div class="small mono">${seriesDone[i]}/${e.sets}</div>
                                        </div>
                                    `).join('')}
                                </div>
                                <button class="btn btn-outline-secondary mt-3" type="button" id="finishTrain">Finalizar entrenamiento</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            trainOverlay.querySelector('#exitTrain').addEventListener('click', () => { clearInterval(tick); hideOverlay(trainOverlay); });
            trainOverlay.querySelector('#finishTrain').addEventListener('click', () => finishWorkout());
            trainOverlay.querySelector('#prevEx').addEventListener('click', () => { idx = Math.max(0, idx - 1); phase = 'exercise'; restLeft = exercises[idx]?.restSeconds ?? 60; render(); });
            trainOverlay.querySelector('#nextEx').addEventListener('click', () => { idx = Math.min(exercises.length - 1, idx + 1); phase = 'exercise'; restLeft = exercises[idx]?.restSeconds ?? 60; render(); });
            trainOverlay.querySelector('#markSet').addEventListener('click', () => { seriesDone[idx] = seriesDone[idx] + 1; render(); });

            const restBtn = trainOverlay.querySelector('#startRest');
            if (restBtn) restBtn.addEventListener('click', () => { phase = 'rest'; restLeft = exercises[idx]?.restSeconds ?? 60; render(); });
            const skipBtn = trainOverlay.querySelector('#skipRest');
            if (skipBtn) skipBtn.addEventListener('click', () => { phase = 'exercise'; if (idx + 1 < exercises.length) idx += 1; restLeft = exercises[idx]?.restSeconds ?? 60; render(); });
        }

        render();
        showOverlay(trainOverlay);
    }

    loadFitness().catch(() => {
        document.getElementById('hello').textContent = 'Error cargando Fitness';
    });
</script>
{% endblock %}
