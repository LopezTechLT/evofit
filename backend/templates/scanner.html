{% extends "base.html" %}
{% block content %}
<h2>Escanear QR</h2>
<p class="text-muted">Apunta al código QR del cliente para registrar su entrada.</p>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center">
                <video id="qrVideo" class="img-fluid rounded" style="max-width: 100%; height: auto;"></video>
                <canvas id="qrCanvas" class="d-none"></canvas>
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const video = document.getElementById('qrVideo');
const canvas = document.getElementById('qrCanvas');
const ctx = canvas.getContext('2d');
const resultDiv = document.getElementById('result');
let scanning = true;

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => { video.srcObject = stream; video.play(); })
    .catch(() => { resultDiv.innerHTML = '<div class="alert alert-danger">Cámara no disponible</div>'; });

function scan() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) {
            scanning = false;
            const clientId = code.data;
            resultDiv.innerHTML = '<div class="spinner-border text-dark" role="status"></div>';
            fetch('/qr_scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_id: parseInt(clientId) })
            })
            .then(r => r.json())
            .then(data => {
                resultDiv.innerHTML = '<div class="alert alert-success">✓ ' + data.client + ' — ' + new Date(data.time).toLocaleTimeString() + '</div>';
                setTimeout(() => { scanning = true; resultDiv.innerHTML = ''; }, 2000);
            })
            .catch(() => {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error al registrar</div>';
                setTimeout(() => { scanning = true; resultDiv.innerHTML = ''; }, 2000);
            });
        }
    }
    requestAnimationFrame(scan);
}
scan();
</script>
{% endblock %}
