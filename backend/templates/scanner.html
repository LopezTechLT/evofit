{% extends "base.html" %}
{% block content %}
<h2>Escanear QR</h2>
<p class="text-muted">Apunta al código QR del cliente para registrar su entrada.</p>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-body text-center">
                <button id="startBtn" class="btn btn-dark mb-3">Iniciar cámara</button>
                <video id="qrVideo" class="img-fluid rounded" style="max-width: 100%; height: auto; display:none;" playsinline></video>
                <canvas id="qrCanvas" class="d-none"></canvas>
                <div id="result" class="mt-3"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h6 class="card-title">O ingresar ID manual</h6>
                <div class="input-group">
                    <input type="number" id="manualId" class="form-control" placeholder="ID del cliente">
                    <button id="manualBtn" class="btn btn-dark">Registrar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const video = document.getElementById('qrVideo');
const canvas = document.getElementById('qrCanvas');
const ctx = canvas.getContext('2d');
const resultDiv = document.getElementById('result');
const startBtn = document.getElementById('startBtn');
let stream = null;
let scanning = false;

function checkin(clientId) {
    scanning = false;
    resultDiv.innerHTML = '<div class="spinner-border text-dark" role="status"></div>';
    fetch('/qr_scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: parseInt(clientId) })
    })
    .then(r => r.json())
    .then(data => {
        resultDiv.innerHTML = '<div class="alert alert-success mb-0">✓ ' + data.client + ' — ' + new Date(data.time).toLocaleTimeString() + '</div>';
        setTimeout(() => { scanning = true; resultDiv.innerHTML = ''; }, 2000);
    })
    .catch(() => {
        resultDiv.innerHTML = '<div class="alert alert-danger mb-0">Error al registrar</div>';
        setTimeout(() => { scanning = true; resultDiv.innerHTML = ''; }, 2000);
    });
}

startBtn.addEventListener('click', () => {
    startBtn.disabled = true;
    startBtn.textContent = 'Iniciando cámara...';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(s => {
            stream = s;
            video.srcObject = s;
            video.style.display = '';
            video.play();
            startBtn.textContent = 'Cámara activa';
            scanning = true;
            scan();
        })
        .catch(() => {
            resultDiv.innerHTML = '<div class="alert alert-danger mb-0">Cámara no disponible</div>';
            startBtn.disabled = false;
            startBtn.textContent = 'Reintentar cámara';
        });
});

document.getElementById('manualBtn').addEventListener('click', () => {
    const id = document.getElementById('manualId').value;
    if (id) checkin(id);
});

function scan() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) {
            checkin(code.data);
        }
    }
    requestAnimationFrame(scan);
}
</script>
{% endblock %}
