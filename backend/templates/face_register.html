{% extends "base.html" %}
{% block content %}
<h2>Registro facial</h2>
<p class="text-muted">Selecciona un cliente y captura su rostro para habilitar el check-in facial.</p>

<div class="row">
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-body">
                <label class="form-label">Cliente</label>
                <select id="clientSelect" class="form-select mb-3">
                    <option value="">-- Seleccionar --</option>
                    {% for c in clients %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
                <button id="startBtn" class="btn btn-dark mb-3" disabled>Iniciar camara</button>
                <div id="status" class="mb-2"></div>
                <video id="video" class="img-fluid rounded" style="max-width:100%;height:auto;display:none" playsinline></video>
                <canvas id="canvas" class="d-none"></canvas>
                <div id="preview" class="mt-2"></div>
                <button id="captureBtn" class="btn btn-primary mt-2" style="display:none">Capturar rostro</button>
            </div>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const captureBtn = document.getElementById('captureBtn');
const statusDiv = document.getElementById('status');
const preview = document.getElementById('preview');
const clientSelect = document.getElementById('clientSelect');
let stream = null;
let capturedCount = 0;

clientSelect.addEventListener('change', () => {
    startBtn.disabled = !clientSelect.value;
});

startBtn.addEventListener('click', () => {
    startBtn.disabled = true;
    statusDiv.innerHTML = '<span class="text-muted">Iniciando camara...</span>';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(s => {
            stream = s;
            video.srcObject = s;
            video.style.display = '';
            video.play();
            captureBtn.style.display = '';
            statusDiv.innerHTML = '<span class="text-success">Camara activa. Presiona "Capturar rostro".</span>';
        })
        .catch(() => {
            statusDiv.innerHTML = '<span class="text-danger">Camara no disponible</span>';
            startBtn.disabled = false;
        });
});

captureBtn.addEventListener('click', () => {
    if (!stream || !clientSelect.value) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    canvas.toBlob(blob => {
        fetch('/face/register/' + clientSelect.value, { method: 'POST', body: blob })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    statusDiv.innerHTML = '<span class="text-danger">' + data.error + '</span>';
                } else {
                    capturedCount++;
                    statusDiv.innerHTML = '<span class="text-success">' + data.message + ' (' + capturedCount + ')</span>';
                }
            })
            .catch(() => {
                statusDiv.innerHTML = '<span class="text-danger">Error al registrar</span>';
            });
    }, 'image/jpeg');
});
</script>
{% endblock %}
