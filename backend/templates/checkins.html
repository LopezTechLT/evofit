{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <h2 class="mb-0">Entradas (check-in)</h2>
    <a href="{{ url_for('main.escaner') }}" class="btn btn-dark">Escanear QR</a>
</div>

<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title">Entradas hoy</h5>
        <div class="display-6">{{ todays_count }}</div>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr><th>Cliente</th><th>Hora local</th><th>Fecha</th></tr>
        </thead>
        <tbody>
            {% for c in checkins %}
            <tr>
                <td>{{ c.client.name if c.client else 'Eliminado' }}</td>
                <td><span class="local-time" data-utc="{{ c.timestamp.strftime('%Y-%m-%dT%H:%M:%S') }}Z"></span></td>
                <td><span class="local-date" data-utc="{{ c.timestamp.strftime('%Y-%m-%dT%H:%M:%S') }}Z"></span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
document.querySelectorAll('.local-time').forEach(el => {
    const d = new Date(el.dataset.utc);
    el.textContent = d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
});
document.querySelectorAll('.local-date').forEach(el => {
    const d = new Date(el.dataset.utc);
    el.textContent = d.toLocaleDateString('es-CO');
});
</script>
{% endblock %}
